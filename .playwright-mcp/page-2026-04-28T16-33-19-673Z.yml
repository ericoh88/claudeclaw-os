                - generic [ref=e3356]: "I teach a lot of AI workshops and this one humbled me - here's what went wrong and what you can take from it The company was fully Windows 11 with strict IT security → Warp kept getting auto-uninstalled by their firewall → what I planned as 15 minutes of setup turned into over half the session → the fix was embarrassingly simple: just use PowerShell and install Node.js from the browser directly The lesson: send a checklist 24-48 hours before any workshop, every time, no matter how confident you are that your setup process works Bigger realization: I pushed them toward Claude Code when Claude Cowork would have been the smarter starting point → Cowork has one-click connectors to Microsoft 365, Outlook, etc → once IT whitelists Cowork, every underlying tool and MCP is whitelisted by proxy → their use cases were honestly fine for Cowork and we could have spent the whole session on actual learning Here's how I'm thinking about the teaching ladder now: → Shallow end: Cowork and Desktop - easiest install, easiest vocab, builds confidence first → Middle ground: Claude Code with skills - for companies with flexible IT and deeper use cases → Deep end: agents, CLIs, parallel sub-agents - only when the company is ready from an infrastructure and personnel standpoint One insight on skills for teams: if a skill is mostly written instructions with very few functions, it will behave inconsistently across models and context lengths → more Pythonic functions = more deterministic output = more reliable for a team sharing the same skill Questions I'm now asking before every engagement: → what does your IT stack look like? → can you install MCP servers? → are you allowed to access external services via skills? If you're selling AI workshops or education, learn from my scar so you don't have to earn your own"
