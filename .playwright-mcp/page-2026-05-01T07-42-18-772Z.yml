        - generic [ref=e52]:
          - paragraph [ref=e54]:
            - img "brand story dorsata honey" [ref=e55]
            - text: Rich in Polyphenols, every drop of Dorsata Honey contributes to a wholesome and rejuvenating experience. Harvested with care to protect wild bee colonies, it ensures sustainability and supports the preservation of Malaysia’s forest heritage for future generations.
          - paragraph [ref=e56]: With its natural sweetness and purity, Dorsata Honey undergoes stringent testing and ongoing research to maintain high quality and consistency.
          - paragraph [ref=e57]: Choosing Dorsata Honey means supporting local producers and contributing to the local economy. Its cost-effective and sustainable nature makes it an ideal addition to your balanced lifestyle a thoughtful gift for loved ones.
          - generic [ref=e58]:
            - heading "OUR MISSION" [level=3] [ref=e61]:
              - generic [ref=e62]:
                - strong [ref=e63]: OUR
                - text: MISSION
            - paragraph [ref=e66]: To raise awareness about the powerful benefits of polyphenols found in mature honey. We aim to inspire people to nourish themselves, as the way nature has intended it to be. Achieving a balanced lifestyle aligned with natural wellness.
            - heading "OUR VISION" [level=3] [ref=e69]:
              - generic [ref=e70]:
                - strong [ref=e71]: OUR
                - strong [ref=e72]: VISION
            - list [ref=e75]:
              - listitem [ref=e76]: To empower individuals health to reach their fullest potential by promoting cellular wellness through high polyphenol honey, the foundation to optimal health. (modernising honey)
              - listitem [ref=e77]: To bring to public awareness that Malaysia’s rainforest(World’s Oldest Tropical Rainforest) possesses vast importance and benefits to the health of mankind and the need to preserve it for sustainable consumption and production of high polyphenol honey.
              - listitem [ref=e78]: solidifying the foundation of honey as a traditional medicine via scientific and measurable methods and creating more job opportunities and industries downstream.
          - heading "OUR TEAM" [level=3] [ref=e79]:
            - generic [ref=e80]:
