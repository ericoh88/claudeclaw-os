              - strong [ref=e82]: TEAM
          - paragraph [ref=e83]: Our team is built on the strong support of family, friends, dedicated staff, partners and precious customers who have helped Dorsata Honey to grow.
          - paragraph [ref=e84]: We would also like to acknowledge our dedicated researchers from MILA University, USM, UKM to help us understand the real potential of High Polyphenols Honey.
          - paragraph [ref=e85]
