            - text: with a Slack node to post the summary and top clips directly into a team channel — cut down on email noise for internal teams.
          - paragraph [ref=e246]:
            - strong [ref=e247]: Add a Google Drive text file export
            - text: After
            - strong [ref=e248]: "\"14. Set — Build Final Output Data\""
            - text: ", add an HTTP Request step to create a"
            - code [ref=e249]: .txt
            - text: file with the full transcript and upload it to Google Drive — so the transcript is permanently stored and searchable.
          - paragraph [ref=e250]:
            - strong [ref=e251]: Increase the wait time for long videos
            - text: In node
