        - generic [ref=e87]:
          - paragraph [ref=e88]: Paste any video URL into a simple form and the workflow runs three AI tasks at the same time — summary, viral clip identification, and full transcription. It waits for all three to finish, combines every result into a single structured HTML report, and sends it to your email automatically. Built for content creators, marketers, and agencies who want a complete content breakdown from any video in one click — no manual watching, editing, or copy-pasting required.
          - separator [ref=e89]
          - heading "What This Workflow Does" [level=2] [ref=e90]
          - list [ref=e91]:
            - listitem [ref=e92]:
              - strong [ref=e93]: Three outputs from one video URL
              - text: — Paste one URL and get back a written summary (for blog posts or show notes), top 5 viral clips with AI scores (for social media), and a full speaker-labeled transcript (for captions or SEO content) — three deliverables in one run
            - listitem [ref=e94]:
              - strong [ref=e95]: Parallel processing — no extra wait
              - text: — All three WayinVideo tasks start at the same time — if you ran them one by one it would take 3x longer, this workflow cuts that down to the time of the slowest single task
            - listitem [ref=e96]:
              - strong [ref=e97]: All-or-nothing status check
              - text: — The workflow only moves forward when all three tasks finish successfully — if even one is still processing, it waits and retries so you never receive a partial or empty report
            - listitem [ref=e98]:
              - strong [ref=e99]: Auto-retry every 30 seconds
              - text: — If any task takes longer than expected, the workflow checks again automatically every 30 seconds — no manual re-runs, no babysitting
            - listitem [ref=e100]:
              - strong [ref=e101]: API cost included in every report
              - text: — The email shows the total WayinVideo API units used across all three tasks combined — useful for client billing, usage tracking, or agency reporting
            - listitem [ref=e102]:
              - strong [ref=e103]: One email with everything inside
              - text: — You receive a single formatted HTML email containing the video title and URL, AI summary with tags, timeline highlights with timestamps, top 5 ranked clips with scores and durations, and a full scrollable transcript — nothing to open separately
            - listitem [ref=e104]:
              - strong [ref=e105]: One language setting runs across all three tasks
              - text: — Enter a language code once in the form (e.g.
              - code [ref=e106]: es
              - text: for Spanish,
              - code [ref=e107]: hi
              - text: for Hindi) and all three tasks — summary, clips, and transcript — automatically process in that language
