            - text: to target clips in the 30–60 second range — better suited for Reels or Shorts.
          - paragraph [ref=e240]:
            - strong [ref=e241]: Archive every report to Google Sheets
            - text: After
            - strong [ref=e242]: "\"16. Gmail — Send Content Report\""
            - text: ", add a Google Sheets \"Append Row\" step to log the video URL, project name, summary title, date, and API cost for every report — useful for tracking what has been processed."
