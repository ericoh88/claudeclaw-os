          - separator [ref=e167]
          - heading "How It Works (Step by Step)" [level=2] [ref=e168]
          - paragraph [ref=e169]:
            - strong [ref=e170]: Step 1 — Form Trigger (Web Form)
            - text: "The workflow starts when someone fills in the form. You enter three things: the video URL (YouTube or any supported link), an optional project name, and an optional target language code (e.g."
            - code [ref=e171]: en
            - text: for English — leave blank for auto-detect). If you skip the project name, the workflow generates one automatically using today's date.
          - paragraph [ref=e172]:
            - strong [ref=e173]: Step 2 — Set Variables
            - text: The video URL, project name, and target language are stored as clean, labelled variables. This ensures all three WayinVideo tasks that run next all use exactly the same video URL and language — no duplication errors.
          - paragraph [ref=e174]:
            - strong [ref=e175]: Steps 3, 4, 5 — Submit Three Tasks to WayinVideo (Parallel)
            - text: "All three tasks are submitted to WayinVideo at the same time:"
          - list [ref=e176]:
            - listitem [ref=e177]:
              - strong [ref=e178]: Step 3
              - text: sends the video to the Summaries API — to generate a written summary, highlights, and tags
            - listitem [ref=e179]:
              - strong [ref=e180]: Step 4
              - text: sends it to the Clips API — to identify the top 5 viral-worthy clip moments with scores and timestamps
            - listitem [ref=e181]:
              - strong [ref=e182]: Step 5
              - text: sends it to the Transcripts API — to generate a full speaker-labelled transcript
          - paragraph [ref=e183]: Each returns a unique task ID used to check for results later.
          - paragraph [ref=e184]:
            - strong [ref=e185]: Step 6 — Merge and Collect All Task IDs
            - text: The three task IDs coming back from the submission steps are collected together into a single package so the next step can store them all at once.
          - paragraph [ref=e186]:
            - strong [ref=e187]: Step 7 — Store All Task IDs
            - text: "All three task IDs — plus the original video URL — are saved into clearly labelled variables:"
            - code [ref=e188]: summaryTaskId
            - text: ","
            - code [ref=e189]: clipsTaskId
            - text: ","
            - code [ref=e190]: transcriptTaskId
            - text: ", and"
            - code [ref=e191]: videoUrl
            - text: . These are used in every subsequent polling step.
          - paragraph [ref=e192]:
            - strong [ref=e193]: Step 8 — Wait 90 Seconds
            - text: The workflow pauses for 90 seconds to give WayinVideo time to process all three tasks before the first status check. All three tasks are running in parallel on WayinVideo's side during this wait.
          - paragraph [ref=e194]:
            - strong [ref=e195]: Steps 9, 10, 11 — Poll All Three Results (Parallel)
            - text: After the wait, the workflow checks the status of all three tasks simultaneously — each using its stored task ID. Each polling step calls its respective WayinVideo results endpoint and returns the current status and data.
          - paragraph [ref=e196]:
            - strong [ref=e197]: "Step 12 — Check: All 3 Tasks SUCCEEDED? (YES / NO branch)"
          - list [ref=e198]:
            - listitem [ref=e199]:
              - strong [ref=e200]: "YES"
              - text: — If all three statuses equal
              - code [ref=e201]: SUCCEEDED
              - text: at the same time, the workflow moves forward to build the final report.
            - listitem [ref=e202]:
              - strong [ref=e203]: "NO"
              - text: — If even one task is still processing, the workflow routes to a 30-second retry wait and then loops back to re-poll all three. This repeats until all three are complete.
          - blockquote [ref=e204]:
            - paragraph [ref=e205]:
              - text: ⚠️
              - strong [ref=e206]: "Infinite Loop Risk:"
              - text: If any one task never reaches
              - code [ref=e207]: SUCCEEDED
              - text: — due to an invalid video URL, API error, or unsupported format — the loop runs forever. Add a retry counter to stop after 10 attempts and send an error email instead.
          - paragraph [ref=e208]:
            - strong [ref=e209]: Step 13 — Wait 30 Seconds (Retry)
            - text: When not all tasks are ready yet, the workflow waits 30 seconds before polling again — preventing excessive API requests during the retry loop.
          - paragraph [ref=e210]:
            - strong [ref=e211]: Step 14 — Build Final Output Data
            - text: "All results from the three polling steps are assembled into a clean set of labelled variables: the video title, summary text, tags, timeline highlights with timestamps, top 5 clip details with scores, the full speaker-labelled transcript, and the total API units used across all three tasks."
          - paragraph [ref=e212]:
            - strong [ref=e213]: Step 15 — Build HTML Email Body
            - text: "The assembled data is formatted into a complete HTML email with five colour-coded sections: video info and URL, AI summary and tags, timeline highlights, top 5 viral clips with scores and timestamps, and the full transcript in a scrollable block. The email footer includes the generation timestamp."
          - paragraph [ref=e214]:
            - strong [ref=e215]: Step 16 — Gmail Sends the Content Report
            - text: The finished HTML report is sent to the email address you set during setup. The subject line includes the video's AI-generated title. You receive one complete report covering all three WayinVideo outputs — in a single email.
          - separator [ref=e216]
          - heading "Key Features" [level=2] [ref=e217]
          - paragraph [ref=e218]:
            - text: ✅
            - strong [ref=e219]: Three outputs in one run
            - text: — Summary, viral clips, and full transcript are all generated from a single form submission — no separate workflows needed
            - text: ✅
            - strong [ref=e220]: Parallel task submission
            - text: — All three WayinVideo tasks start at the same time — the total wait is the longest single task, not all three added together
            - text: ✅
            - strong [ref=e221]: Single combined IF check
            - text: — The workflow only proceeds when ALL three tasks succeed simultaneously — no partial or incomplete reports
            - text: ✅
            - strong [ref=e222]: Auto-retry on any failure
            - text: — If any one task is still running, the workflow loops back automatically every 30 seconds — no manual monitoring needed
            - text: ✅
            - strong [ref=e223]: Speaker-labelled transcript
            - text: — The transcript section of the email labels each line by speaker and timestamp — useful for quotes, repurposing, and SEO content
            - text: ✅
            - strong [ref=e224]: API cost included in report
            - text: — The email shows total WayinVideo API units used across all three tasks — useful for tracking usage and billing
            - text: ✅
            - strong [ref=e225]: Auto project naming
            - text: — If you skip the project name in the form, the workflow generates one using today's date — so nothing is ever unnamed
            - text: ✅
            - strong [ref=e226]: Language-aware
            - text: — Enter any supported language code in the form and all three tasks automatically process in that language
          - separator [ref=e227]
          - heading "Customisation Options" [level=2] [ref=e228]
          - paragraph [ref=e229]:
            - strong [ref=e230]: Get more viral clips in the report
            - text: In node
            - strong [ref=e231]: "\"4. WayinVideo — Submit Clipping Task\""
            - text: ", change"
            - code [ref=e232]: "\"limit\": 5"
            - text: to
            - code [ref=e233]: "10"
            - text: to include more clip results in the report — the email template shows up to 5 by default but you can increase that in
            - strong [ref=e234]: "\"14. Set — Build Final Output Data\""
            - text: too.
          - paragraph [ref=e235]:
            - strong [ref=e236]: Change clip duration range
            - text: In node
            - strong [ref=e237]: "\"4. WayinVideo — Submit Clipping Task\""
            - text: ", change"
            - code [ref=e238]: "\"target_duration\": \"DURATION_0_90\""
            - text: to
