              - generic [ref=e1934]: Howdy from Manchester, UK!
            - generic [ref=e1937]: It is great to have joined this community. I'm based just south of Manchester, in the UK - near Stockport. Back in the day, I trained as a professional classical singer at the Royal Northern College of Music. I met my wife there, and she's now a composer and an academic lecturer at the RNCM. I'm now an AI consultant, trainer, speaker, and developer. I'm working with a few big clients in the North West of the UK, as well as in the US on AI projects. Loving it! I also run a small web agency which I've run for over 20 years, and I'm a live streaming consultant. I'm a content creator, and have enjoyed doing a lot of speaking at conferences around the world, including Social Media Marketing World, Content Marketing World, Atomicon, and more. I also have a podcast called Smart ADHD which you can probably guess what that is about! My big thing with AI is to help us lean in to what we do best as humans - being creative. Automation, optimisation and efficiency are great, but using it to help us become better at what we do is my thing! Massively into Claude Code, and working on a huge number of projects with it. My big dream is to build a unified inbox which will take all the posts, notifications, and messages from all my social networks and messaging platforms and make them easier to manage, and help me to keep on top of it all, so I can reply to what I need to reply to. And to link that to my tasks and more.
