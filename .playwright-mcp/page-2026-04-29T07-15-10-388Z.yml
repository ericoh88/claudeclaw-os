                - link "/claudex - Codex grills Claude Code's plans before you build" [ref=e305]:
                  - /url: /earlyaidopters/claudex-codex-grills-claude-codes-plans-before-you-build
                  - generic [ref=e307]: /claudex - Codex grills Claude Code's plans before you build
                - generic [ref=e310]: "This is a slash command I put together called /claudex that joins forces between Claude Code and Codex so you stop building on top of mid-tier plans Here's the loop: → Claude Code drafts a plan md based on your prompt → Codex pressure tests it like an adversarial senior engineer → Claude Code revises based on the findings → Repeat for 3 rounds by default (you can push to 5 or 10 but you'll burn tokens) → Plan locks → you execute The big unlock is this runs on the $20 plan because Codex isn't writing code - it's only generating insights for Claude Code to act on Each round has a different persona baked in: → Round 1 grills for design flaws, broken assumptions, ambiguous specs → Round 2 hunts auth gaps and race conditions (the stuff Claude Code always rushes past) → Round 3 thinks about rollback safety, versioning, malleability Under the hood it's using a stop hook to enforce a hard cutoff at your max rounds so it can't hallucinate into 10 cycles, plus a YAML state file that acts like a notepad tracking which phase and round you're in This replaces the workflow I was running for months - paying a Cursor subscription just so Codex could roast Claude Code's plans - with one slash command that internalizes the whole back-and-forth Commands included: /claudex plan, cancel, restart, rollback (with full flags in the repo) Visual breakdown of the loop: https://app.excalidraw.com/l/6djVV8pnCbO/61FndaBXWE4 Repo: https://github.com/promptadvisers/claudex I've also included the prompts I used to reverse engineer the build itself so if you want to fork this or build your own version tethered to local models down the line, you have a working spec to start from For anyone tired of doing manual /codex review → update plan → /codex review again loops every time they start a new feature"
