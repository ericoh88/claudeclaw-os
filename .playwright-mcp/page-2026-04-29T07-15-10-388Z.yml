                - generic [ref=e1616]: 3 wks in update - how you helped in ways I could have never imagined
              - generic [ref=e1619]: "I don't usually am one for the 'I am grateful' posts (or the daily journalling ones either ;) but I have seen so many newbies join so I thought I would share the impact this community had on me, my business, my clients and my efficiency This is from someone who didn't know the difference between Open Claw and Claude Claw. Context: I've been running a successful digital education company in tourism in the Asia Pacific called TourismTribe. We give tourism operators the tools and knowledge to better market themselves. Used to fly over the country 2x a week to deliver workshops. Developed an online platform about 10 years ago to make it more cost effective and reduce the travel requirements. Always been the 'tech nerd who talks business'. Early December, I decided to help a GP / Family doctor friend as a side project - I built her an ADHD assessment tool. Long story short in the attached YT video. Launched it, now need to reach GPs and this is not my industry and this is my side gig so needed to maximise my time. Came across Mark looking for Obsidian stuff. This is how the last 2 weeks panned out: - Sorted out Obsidian in no time - Met @Andrew Zafiropoulos a day after in the Builders meeting - told me about Claud Claw... set that up within 2 days and had a one on one with Andrew a week later (thank you again you have no idea how much it helped) - Same day, joined another meeting, @Mark Kashef popped his head in the meeting, gave me the exact answer I needed re my agent set up - Did more work at night, transcribing V1 to V4 of ClaudeClaw, getting Claude to compare my set up - then of course V5 on the weekend with the War room. - Told the world about this community and realised later I could have used a referral code (who cares!) - Used the search bar like crazy, took notes of all the stuff mentioned in the meetings, stalked many of you, your posts, your githubs... used the last 30 days skill, the digital strategy git, the linkedin skill someone else had designed (found this one looking for remotion... then Abhishek Padmanabhan had responded somehow to that post and I followed. - Was working from the car, came across a post from @Cheryl Tibbs , asked a question, learnt about VAPI which I have now implemented for MySpecialistGP.com.au.... all from the car thanks to Claude Claw and Starlink Roam. - Got an email in my inbox yesterday - got a PR piece for https://velluto.health thanks to the linkedin skill - Got help and motivation and shares on Linkedin from community members who i had just met - Whilst I am writing this my ops agent is posting the video I have uploaded to this post to YT."
