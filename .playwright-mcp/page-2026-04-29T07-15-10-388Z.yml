              - generic [ref=e1314]: Any other Aussies around?
            - generic [ref=e1317]: Hey all, I'm Toby. I run Mamba Digital, a marketing consultancy in Perth, Western Australia, and Mamba Strategic, an AI systems shop for small and mid-sized businesses. I started as an accountant, then wasted a truckload on paying marketers before we realised how totally full of shit they were ... so i became one. Oh the irony! Luckily, it turns out people do look for honesty and financial literacy in their media buyers and marketing partners. The lightbulb moment for me with AI was treating it as an employee, not software. My intense hatred of project management softwares helped fuel this thinking and I simply wanted to build something that came to me, and functioned like a PA. My partner in crime on all of it is @Fabienne Wintle. She is an absolute machine and I do my very best to keep up (and fail like the bozo I am). We have built a range of systems to assist in freeing up time from our normal work, so we can focus more on this. My passion project is an amateur sports coaching assistant. I can help with AI-as-employee system design, marketing automation, and getting agents to stop confidently making things up. I've been humbled by all of it, repeatedly, which is apparently how you learn.
