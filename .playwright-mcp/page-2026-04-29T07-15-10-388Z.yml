                  - generic [ref=e214]: Course Completer Skill - Autocompletes Courses/Quizzes (naughty 😏)
                - generic [ref=e217]: A friend was scrambling to finish the Anthropic Claude Code Architect course so his team could actually enroll to sit the exam So I built a very naughty skill called Course Completer that does it for you (it's primarily geared to Anthropic's pages) Drop the SKILL md from this post into your setup → open Skill Jar (or whatever course platform) → tell Claude in Chrome "mark all as complete" → it hits the network tab and ticks the lessons off For the quizzes it actually takes them on your behalf → if it gets answers wrong it pulls from conversation memory → retries until it passes (quizzes are unlimited so this just works) It chewed through Claude 101 in about 10 seconds and then started the quiz on its own You'll need Claude in Chrome enabled and you'll want to be authenticated to your account first Different course structures have different button layouts so you may need to nudge it once or twice (telling it to click "show answers" or "take this again") but the core mechanics are all there - tweak the skill as needed Honest note - this was built for the Architect course structure → other platforms may need adjustments → and no, I do not advocate using this anywhere it shouldn't be used Perfect for when someone in your group is lagging on the 9 hours of prep and holding up the whole team from applying to sit the real exam (free for the first 5,000 so time matters)
