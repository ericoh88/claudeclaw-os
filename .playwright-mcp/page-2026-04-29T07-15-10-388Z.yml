              - generic [ref=e1396]: "In today’s AMA, I showcased how I built a Claude research skill that was version 1.0.0 (just talking, not actually showing). Hint: I've added several screenshots and a short video. After our hangout, I came up with an idea that takes it to version 2.0. The skill can now run autonomously with or without verbose mode. In the demo video, I used both step mode and verbose mode so you could see what it’s doing while I interact with it. What you’re seeing there is medium verbosity enabled. Full verbosity goes even deeper, showing its thought process in real time. Check out the screenshot of it running in Claude Code. I’ve also included a short (no-sound) video where I trimmed the pauses between its reasoning steps so you can clearly see the flow of its actions. --- How this works: This builds on several skills I previously developed in Claude, which have become increasingly sophisticated over time. This week, I had the idea to bring them all together in Claude Code, combining them into a single framework skill that functions as a researcher instead of \"just\" a coder. Now it can combine this. If needed additionally, I installed PARI/GP locally, which is a quite common math library that it can use as well. So it can give quite some calculations to that, if necessary. Just tell it at the beginning of your research. Yes. This could also be automated..."
