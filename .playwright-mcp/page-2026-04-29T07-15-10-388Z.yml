            - generic [ref=e1109]: I have a consulting client who is after an LLM assistant that triages email, calendar, and that sends then collaborates with him on - weekly plan - morning check in on key items that day and specific emails he likely wants to make sure to follow up on - end of day check in on the day, any new commitments that need to be tracked or scheduled, and anything that didn't get done that needs to roll over to the next day. - Ad hoc messages The Anthropic @Claude app can take care of ad-hoc and Scheduled Cowork via the Slack connector (though it shows up from me to me or from me into a channel, both are not ideal) but then the memory is disconnected unless I tell my client to include specific instructions in each message ("Go check [Google Doc] for context" or something). For my own workflows for one of my projects I have long lived tmux sessions that I communicate with via Slack (using this Claude Code to Slack bridge). A setup like that, or ClaudeClaw, feel like overkill and introduce remote system administration and whatnot for me (which I could absolutely bill for). Do any of you have any existing patterns that you've found work well? I'm almost tempted to just suggest he goes and signs up for an Every Inc agent.
