              - generic [ref=e811]: "I woke up this morning to the attached sales. SALES not leads. Sales that required ZERO human interaction (apart from me building the system). Wahoo. TLDR: this is my velluto.health & myspecialistgp.com.au side project I started by helping out a friend who is a GP/Family doctor give better care to patients. When she saw the system she said we have to take this Australia wide. It was about the same time I joined this community. NOTE: This is not my day job but this is the vessel to me getting better at putting AI into business practice as there is immediate gratification and real dopamine boost as the fish are hungry in that lake! Somehow I'd set up GA4 tracking last week and forgot to bcc myself in the sale for this ONE GP who we currently have signed up. I thought I'd have a quick check today to see how things were going.... Well, I'm not ready to buy my husband the helicopter he asked for when I said I was going to into hibernation mode from our relationship building something but, it is a GOOD start. 🎉 My challenge now is getting it into the hands of more GPs/doctors who are all 'too busy' .... to talk to me! Maybe this screenshot will speak to them!"
