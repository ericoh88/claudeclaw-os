                - generic [ref=e3576]: Agent Teams for Non-Technical Tasks - 92 Slide Deck in Minutes
              - generic [ref=e3579]: "I found a really strong application for Claude Code agent team I have less than 24 hours to build a 100-slide course deck for O'Reilly Media, so I put agent teams to work on the entire process Step one: Claude Code generated 92 slides with visuals covering a full 4-5 hour live course Step two: I had it spawn 4 agent team members - Sarah, James, Priya, and Carlos - each taking on a different persona of someone who might take this course Their job was to roast every slide → score comprehension out of 5 → flag anywhere I assumed knowledge that a complete beginner wouldn't have James was brutal - calling out things like \"you assume I know what a CLAUDE MD is\" and \"three concepts dropped at once with no introduction\" Step three: I fed all the audit logs back in and spawned a new agent team to fix every slide where comprehension wasn't a perfect 5 out of 5 Then a cleanup team caught 941 formatting issues across 92 slides - overlapping titles, duplicate footers, diagram problems The key insight is that agent teams shine on meaty non-technical tasks like slide decks, proposals, Excel files, and PDFs because they break the work into batches instead of bloating your context window This same approach works for any large content creation task - you just need to provide the direction and let the teams audit and refine in waves Big disclaimer: agent teams do consume more tokens, but the ROI here was massive for the time saved"
