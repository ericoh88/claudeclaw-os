              - link "# Cool Stuff I've Done with Claude Code to Make It Fit My Needs" [ref=e3799]:
                - /url: /earlyaidopters/cool-stuff-ive-done-with-claude-code-to-make-it-fit-my-needs
                - generic [ref=e3801]: "# Cool Stuff I've Done with Claude Code to Make It Fit My Needs"
              - generic [ref=e3804]: "## 1. A Regex-Based Intent Router That Picks the Right Model Before Claude Even Sees the Message Most people just send everything to one model and call it a day. I built a classification layer that sits between Telegram and Claude. It's pure regex, no API call, runs in under 50ms, and routes every single message to one of three model tiers based on what you're actually asking for. Say \"hey\" or \"thanks\" and it goes to Haiku ($1/1M tokens). Ask it to send an email or check your calendar and it goes to Sonnet ($3/1M). Ask it to write a proposal or build a feature and it goes to Opus ($15/1M). The router has 14 intent categories with around 100 regex patterns, and it logs every classification to SQLite so I can pull up a `/router_stats` command and see exactly where my money is going. Real-world distribution: about 84% of messages hit Sonnet, 14% hit Haiku, and only 2% need Opus, saving me roughly 70-80% compared to running everything on Opus. --- ## 2. A Subagent Army with an Autonomous Action System Instead of one monolithic AI that does everything, I have six specialized agents that each own a domain. When a message comes in, the main orchestrator reads a delegation table and spawns the right subagent. The comms agent handles emails, calendar, and WhatsApp. The finance agent handles invoices and payments. The research agent runs multi-platform research. And so on. What makes this actually useful (and not just architecture for architecture's sake) is the autonomous action system layered on top. When I say \"message Sarah the deck is ready\", it resolves the contact, checks for exactly one match, and sends it immediately. No \"are you sure?\" prompt. But if it finds two Sarahs, or if the message involves money or pricing, it stops and asks. The rules are explicit: imperative command plus single contact match equals auto-execute. Anything ambiguous, risky, or involving money equals confirm first. It tracks which subagent handled each message in SQLite, so I can see delegation percentages in my router stats. --- ## 3. A Free Research Pipeline That's 7,500x Cheaper Than Doing It All with Claude This is probably the one I'm most proud of. When I ask my assistant to do research (competitor analysis, brand audit, trend analysis, whatever), it doesn't just dump everything into Claude and burn tokens. Instead, it runs a three-stage pipeline where the expensive parts are replaced with free tools. Stage one: Python scripts scrape data from Instagram, TikTok, YouTube, Google Trends, and Meta's Ad Library. All free, using open-source libraries like Instaloader, yt-dlp, and pytrends. Stage two: that raw data gets fed into Google's NotebookLM, which synthesizes it into a coherent report, also for free. Stage three: Claude just formats the final output for Telegram delivery, burning maybe 1-5K tokens instead of 50K+. The result is that a research request that used to cost $5-20 now costs about $0.01-0.03. Everything is tracked in a research index so notebooks get reused instead of recreated if I ask about the same topic within a week. --- These three systems work together. The intent router classifies the message and picks the cheapest model. If it's a research task, the orchestrator prepends instructions that trigger the free pipeline. If it's a messaging task, it delegates to the comms agent which auto-sends or confirms based on explicit rules. Everything is logged to SQLite so I can audit costs, see which agents are being used, and make data-backed decisions about what to optimize next. If you're building something similar with Claude Code, the key insight is: Claude is incredible at reasoning and orchestration, but it doesn't need to do everything. Offload the mechanical stuff to free tools, route simple tasks to cheaper models, and let the expensive model focus on what it's actually good at."
