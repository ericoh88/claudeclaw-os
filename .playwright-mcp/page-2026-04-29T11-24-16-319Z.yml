                - /url: https://www.youtube.com/redirect?event=video_description&redir_token=QUFFLUhqbHZ6Q1FRSXktdnlVRV9SdDVuYVBGeXI0dHJZd3xBQ3Jtc0ttWHhMZlVtcVFwRTBiVFBIUVktVm9YVFA4SXJ0aDdSS0gwQVRsSF8xYkVja216NlF3dkhCN3ZZLVl1emNjakFOM2gyUVNyT1otWEVBcGdyS3lhLUlKekZVSGhnWnVadXBITTR6b0RLZkVKSlYtNWJnOA&q=https%3A%2F%2Fbrad-b.kit.com%2Ff9a7349a1c&v=QZMljuD10sU
              - text: "Claude Code can't watch video. Anthropic still has not shipped a video model, so by default Claude is blind to anything that lives inside an mp4, a YouTube link, an Instagram reel, or a Loom. Every other transcript tool I tried before this one only ever read the words and missed half of what was actually on screen, which is where most of the interesting stuff in a video lives. This Claude skill fixes that by handing Claude both the frames and the timestamped transcript at once, so it can actually watch any video, not just read its captions. In this Claude Code tutorial I walk you through the exact pipeline behind the skill. yt-dlp pulls the file from any of over a thousand sites it supports. ffmpeg slices the video into frames and a clean audio track. Free YouTube captions come in straight from the source when they exist, and Groq Whisper fills the gap when they don't. I run a 45 minute lecture through it in under two minutes, walk through the cost math (about a dollar per run, transcription almost always free on Groq's tier), and finish on the use case that actually changed how I consume content: feeding every video I would have watched manually straight into my Obsidian second brain. Whether you make YouTube content, run a research-heavy job, manage a flooded inbox, or build software, this skill replaces the manual scrubbing, pausing and re-watching with a paste. It's a Claude agent skill anyone can install in under five minutes, not just developers. Timestamps"
