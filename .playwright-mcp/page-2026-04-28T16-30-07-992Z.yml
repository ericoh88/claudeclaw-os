                - generic [ref=e216]: "We're adding two coaches to the avengers lineup, both filling gaps that have been requested for months. ⭐️ For those who are newer to the community⭐️ 𝗪𝗲 𝗰𝗼𝘃𝗲𝗿 𝘁𝗵𝗲 𝗰𝗼𝘀𝘁 𝗼𝗳 𝗮𝗹𝗹 𝗰𝗼𝗮𝗰𝗵𝗶𝗻𝗴 𝗮𝘀 𝗽𝗮𝗿𝘁 𝗼𝗳 𝘆𝗼𝘂𝗿 𝗺𝗲𝗺𝗯𝗲𝗿𝘀𝗵𝗶𝗽. In exchange, we ask that 1:1 sessions be recorded so we can share them with the rest of the community. That way everyone benefits, not just the person on the call. Group sessions are always open to attend live. All coach calendars are HERE - please use these calls to solve targeted problems or explore opportunities relevant to that specific coaches' scope. --- 𝗘𝗻𝘁𝗲𝗿𝗽𝗿𝗶𝘀𝗲 𝗦𝗮𝗹𝗲𝘀 𝗘𝗻𝗮𝗯𝗹𝗲𝗺𝗲𝗻𝘁 - Brannon Winn Brannon has 25+ years of upper management experience across C-suite roles -- 𝗖𝗖𝗢 𝗮𝘁 𝗙𝗿𝗲𝗻𝗰𝗵𝗯𝗲𝗲 & 𝗔𝗶𝗿 𝗖𝗮𝗿𝗮𝗶𝗯𝗲𝘀, 𝗩𝗣 𝗡𝗼𝗿𝘁𝗵 & 𝗖𝗲𝗻𝘁𝗿𝗮𝗹 𝗔𝗺𝗲𝗿𝗶𝗰𝗮 𝗮𝘁 𝗧𝗔𝗣 𝗔𝗶𝗿 𝗣𝗼𝗿𝘁𝘂𝗴𝗮𝗹, 𝗖𝗥𝗢 𝗮𝘁 𝗣𝗮𝗰𝗸𝗮𝗴𝗲 𝗦𝗼𝗹𝘂𝘁𝗶𝗼𝗻𝘀, 𝗦𝗩𝗣 𝗕𝘂𝘀𝗶𝗻𝗲𝘀𝘀 𝗗𝗲𝘃𝗲𝗹𝗼𝗽𝗺𝗲𝗻𝘁 𝗮𝘁 𝗜𝗻𝘁𝗲𝗻𝘁 𝗠𝗲𝗱𝗶𝗮, 𝗖𝗦𝗢 𝗮𝘁 𝗔𝗹𝗹𝗶𝗮𝗻𝘇 𝗧𝗿𝗮𝘃𝗲𝗹 𝗜𝗻𝘀𝘂𝗿𝗮𝗻𝗰𝗲. He's managed 𝗕$𝟭+ 𝗣&𝗟𝘀 and splits his time between Paris and Atlanta. What makes him different: he's sat in the executive buyer's chair. He knows exactly how Sales, Customer Support, Marketing, and Operations leaders think at every company size -- and he's technical enough on AI to help you architect the solution they'll actually pay for. Today he runs Winn-Global doing strategic advisory for investment funds focused on Go-To-Market strategy and AI in the workplace. He spends at least an hour a day in his own Claude setup. ⚠️ Book Brannon ONLY if you are selling into enterprise. He is not the coach for \"how do I get my first client\" or beginner GTM questions. He's the coach for winning bigger deals, navigating executive buyers, fixing your enterprise funnel, or building a GTM motion that holds up at scale. If you're earlier in your journey, Taha is putting together a sales course specifically for beginners on top of all the existing resources we already have in the classroom -- more on that by end of month."
