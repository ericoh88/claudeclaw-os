                - generic [ref=e1818]: Hey Mark, Thanks For Making Us All Lazy! 😅
              - generic [ref=e1821]: So I'm using Claude Code to help me build a fairly complex Content Production Board in Notion for my business. After setting up a project and carefully planning everything, Claude Code began building my Content Production Board in multiple phases. Deep into the build, CC told me that it couldn't automatically configure all the multiple views specified in the plan due to limitations in Notion's API, and that I would have to go and manually set these up in Notion. Claude also kindly offered to provide me with instructions for all 20+ board views and any other manual settings and adjustments I'd have to make. Having been programmed in this community by @Mark Kashef over many months to "be lazy," I asked Claude Code to go through each task with me one at a time and provide me with detailed "click-by-click" instructions. I then took a screenshot of each task's instructions, opened Notion in my Chrome browser, fired up the Claude for Chrome extension, pasted in the screenshot, gave it a simple prompt ("Please follow these instructions to create a new view in the database") and let Claude do all the work while I went and made myself snacks, watered my plants, watched clouds float by, etc. At the end of each completed task, I copied the results posted by Claude for Chrome back into Claude Code, added a screenshot of the new board view. Claude Code reviewed it, approved my great work, and gave me the instructions for the next task. So, I lazily rinsed and repeated this until all my "manual" work was done. If you haven't started using the Claude Chrome extension yet, you're working too hard. Here's to being lazy and getting more s#!t done! 😂
