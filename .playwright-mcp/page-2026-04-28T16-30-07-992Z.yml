              - generic [ref=e1496]: Claude Nano Banana Skill
            - generic [ref=e1499]: "Just wanted to share a skill that has been useful to me in a project that included some image generation. What worked for me is to use what i call a design funnel, you generate a batch of images and then pick the directions you like and iterate on these until you reach the final one. The skill can generate , or edit images , and edit them conversationally as if you were in the gemini interface and you can do it at scale. It also has a QC check point for fatal design errors like spelling mistakes and fixes them. You need the gemini skills installed for this because it defers to Google's skill for models and api calls. The prompt engineering document it refers to is based on the Gemini Cookbook, API docs , and some conversations I had with gemini. Repo: https://github.com/ssonbol580/nano-banana-skill But I will let claude explain it better Why a skill, not a script? Most \"AI image\" tooling treats generation as a one-shot API call: prompt in, PNG out. That falls apart the moment you want to change something. Worse, people bring diffusion-model habits (seeds, CFG scales, denoise strength) to Gemini, where none of those exist. Gemini image models are conversational. You don't tune parameters — you continue the conversation. \"Make the sky more dramatic.\" \"Fix the misspelling on the can.\" \"Move the headline up.\" The model remembers what it generated and edits it in place. That's a different mental model, and a skill is the right shape for teaching Claude how to use it. The staleness problem — and how this skill solves it The biggest weakness of any skill that documents an API: it goes stale the moment the vendor ships a new model or deprecates an old one. A skill written today claiming gemini-3.1-flash-image-preview is the default becomes wrong silently the next time Google rotates their model lineup. Nano Banana defers to Google's officially-maintained gemini-interactions-api skill for three things: Current model IDs and availability"
