            - generic [ref=e1231]: "Hey everyone 👋 I've started to build n8n automations and I feel like my process is inefficient compared to what's actually possible. Here's my current setup for context: - n8n self-hosted on a VPS (Hostinger Docker) - Workflows versioned in GitLab, a cron job runs daily and auto-exports any changed workflow to the repo - Claude (chat + Claude Code) as my main AI assistant during the build So the version control side is handled. But the development loop itself is still painful. Here's what my day to day actually looks like: - I get an error, I manually copy the log, paste it to Claude, read the fix, copy it back into n8n - I need a node built, Claude gives me JSON that's sometimes outdated or has wrong parameter names for the actual node version - I want to iterate, I have to make sure the workflow file in GitLab and in Claude's context is the latest export or Claude is working off stale code - Deep in a long build session, Claude starts contradicting advice he gave two hours ago because he lost the full picture I tried Claude Code thinking the project context would fix things, and it helps, but the same walls are still there. The workflow file has to be manually re-exported and updated in the project or nothing is in sync. And node-level accuracy is still hit or miss on recent n8n versions. It works but it's slow and I know I'm leaving a lot on the table. Curious what your best practices and actual stack look like when you're building automations seriously for client, especially now that we have so many agentic options available. What changed in how you work? And honestly, are you even still using n8n or did you move to something else? Not looking to over-engineer it, just want to work smarter. As Mark said, the path of least resistance 😄"
