            - generic [ref=e2040]: Most of the content and discussion I see everywhere seems to be about focusing on automating publishing to social media and messaging platforms. For example, creating Instagram Reels and auto-publishing, or automating posts to LinkedIn, etc. Or even auto-replying to messages, comments, or posts. But what about using AI to read posts, comments, and messages, and help manage it all? My big goal is to build a unified inbox tool that brings everything together in one place. Everything has become fragmented and cluttered across multiple platforms. And the amount of AI being posted to these channels is not exactly helping. I've been building a tool which will take the posts from the people I follow on Facebook, Instagram, LinkedIn, X, etc. This will also include stories, messages, comments etc. And also from Discord, Circle, Facebook group posts etc. It would connect to a dashboard and a task tool to keep me on top of things. I'm happy to share more about the concept and what I've done so far another time. A few platforms are easier than others. YouTube and X are fairly simple. Same with Discord. But getting posts, notifications, and messages from LinkedIn, Facebook, and Instagram is proving a bit of a nightmare. I'd love a way to automate grabbing these posts etc to my database a few times per day. I'd love to know if any of you are using tools or skills, etc., to help with this kind of thing?
