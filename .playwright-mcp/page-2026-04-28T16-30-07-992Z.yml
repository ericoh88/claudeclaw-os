            - link "I built a skill that audits Claude's reasoning" [ref=e1565]:
              - /url: /earlyaidopters/i-built-a-skill-that-audits-claudes-reasoning
              - generic [ref=e1567]: I built a skill that audits Claude's reasoning
            - generic [ref=e1570]: I built a skill that audits Claude's reasoning — because I got tired of being convinced by fluency instead of rigor. Here's the thing nobody warns you about when you start using LLMs for real work. Not the hallucinations — you learn to spot those fast. It's the other thing. The moment you realize you just accepted a recommendation not because the reasoning was sound, but because the paragraph was so damn smooth that questioning it felt unnecessary. I've been deep in Claude Code for about ten months now. And somewhere around month three, I caught myself doing something that scared me a little. I'd ask for strategic advice — and the answer would come back confident, well-organized, every objection pre-addressed with a thoughtful sentence. And I'd nod. Move on. Act on it. Then later — sometimes days later — I'd realize the answer had quietly closed off an alternative I never got to evaluate. Or it had assumed a constraint I never actually stated. Or it dismissed a real risk with a sentence that sounded like it meant something but actually said nothing at all. Mental models helped, at first. I'd been prompting with them from day one — inversion, circle of competence, second-order thinking — because they give the LLM a reasoning shape it can grab onto. Useful, sure. But still just prompting. The model would nod along, weave the framework into its answer, and hand back something that looked like structured thinking but carried the same blind spots underneath. Asking the same system to find its own flaws is... well, you know how that goes. What I wanted was different. I wanted something that could convince me by rigor, not rhetoric. Not a better answer — a reason to trust the answer I already had. Or a specific, grounded reason not to. So I built Lolla. It's a Claude Code skill — you're mid-conversation, getting advice on something that matters, you type /lolla, and it runs a structural audit on the reasoning you just received. Not by prompting harder. By routing the conversation through a curated substrate of 224 mental models with validated failure modes, premortem questions, and relationship tensions, all compiled from roughly 200 books. The detection itself runs through a separate model via OpenRouter, because the thing that produced the reasoning shouldn't be the thing auditing it.
