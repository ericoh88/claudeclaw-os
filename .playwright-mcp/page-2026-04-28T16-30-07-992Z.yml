              - generic [ref=e2189]: "I've built something. Didn't even know what it would become in the beginning. I needed a break from the heavy research project, so I spent a bit making an audio visualizer and also to put Claude 4.7 somewhat to the test. TL;DR 🎛️ Drop any MP3 into the window and it reacts live. Tunnel breathes on the bass, camera lurches on the big hits, lens flares pop on kicks, palette cross-fades through six color sections as the track progresses. 3D particle field streaming past you, waveform bars across the bottom, fullscreen on the left rail. Runs on phones, too. Hint: In case it doesn't work on your phone or browser, I've added a short clip to show what i generally looks like. 🔗 Early AI-Dopters Audio Visualizer - GitHub Page Default track is a Suno song of mine (\"The Moons of Saturn · Energy\") Just hit play to listen to it. The whole thing is song-agnostic. Drop your own Suno output or whatever song or sample and see what it does with it. 🎨Aesthetic is demoscene-meets-LCARS. Bright, loud, sci-fi, tube-tunnel. It'll sit really well on energetic tracks and push against mellow ones — worth trying both to see what happens. 📹Live-only for now. To share a clip, just screen-record (OBS on desktop, built-in recorder on phone). ⚙️Single HTML file. No install, no signup. Open, click, done. Source here if you want to peek: Github Repo Audio Visualizer"
