                - generic [ref=e862]: Risking Anthropic Ban! Are DIY ClaudClaw Agents Long Term OAuth Gateways Risky?
              - generic [ref=e865]: "Watched this great breakdown on Claude subscription usage tiers (safe vs controversial vs bannable) — watch it here https://youtu.be/8IDzBRRFnQU?si=D6n7c2KSy3RaM_Tt The golden rule from the video is simple: \"Your Pro/Max subscription is for your individual use.\" If you're the only human whose work these agents are running, OAuth token is fine. If anyone else benefits, use an API key. My situation: I'm building a personal agentic team where a Discord bot in a private server (just me) acts as the command layer. I'm the only user, the only beneficiary. By the golden rule, this should be fine. The concern: From Anthropic's side, the traffic pattern looks like a bot with always-on Discord webhooks — the exact fingerprint their abuse classifier uses to flag third-party harness usage. Even though it's just me, the optics match a multi-user setup. Indy's video calls this the \"controversial\" tier — not technically violating the rules, but in the gray area where Anthropic's own employees have given contradictory answers. One engineer got banned, then reinstated, after using OpenClaw (another third-party harness). My question for the group: 1. Are any of you running Discord bots as agent orchestration layers? 2. Did you go with OAuth token or API key for the bot layer? 3. Has anyone actually had their account flagged for this pattern? 4. Is the separation approach sound — OAuth for direct sessions, API key for the always-on bot gateway? Indy's recommendation was to use API keys for \"long-lived gateway hosts\" which a Discord bot definitely is and Mark’s ClaudeClaw is also built around this concept. But I want to hear from people actually doing this in practice. Would love your experiences, especially if you've been at this for a while without issues."
