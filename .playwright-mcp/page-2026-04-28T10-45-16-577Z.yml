                - generic [ref=e1969]: Claude Code zero to hero feedback
              - generic [ref=e1972]: "For all the claude code newbies, hope this helps. And for Anthony and Mark as you create more claude code content. Although I'd watched a ton of Mark's older tutorials, one thing I was looking for was a structured way of learning the claude code ecosystem. After going deep into the newer Anthony's course, cloning and working through the Github repos, here are a few of my gotchas as a total newbie. (gotcha is claude's terminology and I'm rolling with it :) Pro Tip: Read all the README.md files in each module. They are comprehensive. I only discovered this in Module 3 :) I created a Claude.ai project to help me answer the following questions. And at the end, we drew up the document attached to this post. Feel free to use it if it helps you. Module 1 Getting Started & Environment Setup - Three terms that threw me from the start: Didn't know what 'GitHub CLI' was. In fact I had no idea what the 'terminal' did or how it connected folders/files on my laptop the 'Cursor IDE' application. Total noob fail. So maybe a one-liner of these features could help newbies. There's much more in the attached document. Module 2 Slash Commands How to install commands globally when you clone a repository. I mistakenly thought that cloning a local folder somehow meant it was also cloned on github. I think it was the gh command that threw me :) Something else that confused me was seeing similarly named commands in different projects. I wondered if they were the same command or if particular to a project. I think it's the former. Module 4 MCPs The mcps in the cloned course project had failed statuses for me even after I restarted Claude code in cursor. I had to install uv because something wasn't available on my system. I probably had to use the /EA-preload-mcps command now I think about it. Also I hadn't read the README.md file 🤪 You're going to run into things like this. No one course can cover the edge cases so just ask an LLM for help by taking a screenshot."
