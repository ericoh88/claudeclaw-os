              - generic [ref=e1065]: "My anniversary contribution: Self Claude Code Course"
            - generic [ref=e1068]: "I used the Learn Anything skill to build a full 10-module course on Claude Code. It covers everything from architecture and mental models to skills, hooks, MCP, servers, and advanced workflows. The course content is heavily informed by @Anthony Medina fundamentals series (his full course repo + video transcripts) and several of @Mark Kashef's videos How it works Just open it with claude, and run /next. The onboarding asks you: - Your language — learn in English, French, Spanish, whatever you prefer - Your level — beginner, intermediate, or advanced - Your teaching style — concise, detailed, encouraging, Socratic, or visual - Your learning mode — direct instruction, example-first, project-based, speed-run, deep-dive, or Socratic The course adapts to all of that. Every module has lessons, exercises, hints, and review quizzes — all generated on the fly based on your preferences. What's in it ┌────────┬─────────────────────────────────┐ │ Module │ Topic │ ├────────┼─────────────────────────────────┤ │ 1 │ Architecture & Mental Model │ ├────────┼─────────────────────────────────┤ │ 2 │ CLAUDE.md & Memory System │ ├────────┼─────────────────────────────────┤ │ 3 │ Settings, Permissions & Sandbox │ ├────────┼─────────────────────────────────┤ │ 4 │ Slash Commands │ ├────────┼─────────────────────────────────┤ │ 5 │ Hooks System │ ├────────┼─────────────────────────────────┤ │ 6 │ Subagents & the Task Tool │ ├────────┼─────────────────────────────────┤ │ 7 │ Skills │ ├────────┼─────────────────────────────────┤ │ 8 │ MCP Servers │ ├────────┼─────────────────────────────────┤ │ 9 │ Plugins │ ├────────┼─────────────────────────────────┤ │ 10 │ Advanced Workflows & Patterns │ └────────┴─────────────────────────────────┘ Optional companion: Media Extract skill"
