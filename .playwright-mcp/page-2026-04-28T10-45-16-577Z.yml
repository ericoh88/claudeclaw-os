            - link "I closed two discovery calls in a pitch black sauna (true story) 🚿" [ref=e2135]:
              - /url: /earlyaidopters/i-closed-two-discovery-calls-in-a-pitch-black-sauna-true-story
              - generic [ref=e2137]: I closed two discovery calls in a pitch black sauna (true story) 🚿
            - generic [ref=e2140]: "This is a fully true story with zero exaggeration and a good reminder that you can generate leads and business pretty much anywhere - including a sauna I've also typed this all manually, no AI was harmed in the making of this post. Picture pitch black sauna, steam everywhere, couldn't see a single face → just me trying to silently decompress after a full day of ClaudeClawing A voice emerges from the darkness: \"what do you do for a living?\" → I groaned internally, as it was my scheduled time to be a full introvert and not think about work (or AI) Hestitantly, I said I run an AI consultancy. Turns out this gentleman sells corrugated cardboard to Latin American markets - specifically the tubes inside toilet paper rolls (the niche of niches, razor thin margins, pure volume play) He lives in Salesforce all day and wishes it would ping him when certain events fire → I walked him through Claude Cowork and Code and theoretically how they could help him → then I walked through how I was silently responding to client emails via my ClaudeClaw and his ears perked up immediately Then I mentioned a lawyer client I'm actively consulting for to help replace some grunt work in his practice with Claude Cowork + Claude Code *Another shadow leans in from across the sauna*: \"i'm sorry to interrupt, but can I ask you something\" This next individual turns out to be a construction business owner, deep in multi-month litigation, sitting on 12 separate email accounts spanning a few years plus a 1,000 page prime contract and a 40 page subcontract → lawyers billing him 'hourly' to comb through it all manually His own words on the discovery I just got off right now: \"I'm a bit of a Luddite, I use ChatGPT for basic stuff, never even touched Claude\" → his step one was literally just \"call Mark\" (his actual words) I walked him through Microsoft 365 connector → Claude Cowork → convert the contract PDFs to markdown so the LLM can actually parse the structure → spawn sub-agents to deep search 2 years of emails for specific reference points"
