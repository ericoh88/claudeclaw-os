                  - listitem [ref=e472]:
                    - strong [ref=e473]:
                      - code [ref=e474]: ffmpeg
                      - text: extracts frames at an auto-scaled rate.
                    - text: "The frame budget is duration-aware: ≤30s gets ~30 frames, 30-60s gets ~40, 1-3min gets ~60, 3-10min gets ~80, longer gets 100 sparsely. Hard ceilings: 2 fps, 100 frames. JPEGs at 512px wide by default — bump with"
                    - code [ref=e475]: "--resolution 1024"
                    - text: if Claude needs to read on-screen text.
                  - listitem [ref=e476]:
                    - strong [ref=e477]: The transcript comes from one of two places.
                    - text: "First try:"
                    - code [ref=e478]: yt-dlp
                    - text: "pulls native captions (manual or auto-generated) from the source. Free, instant, accurate-ish. Fallback: extract a mono 16 kHz audio clip and ship it to Whisper — Groq's"
                    - code [ref=e479]: whisper-large-v3
                    - text: (preferred — cheaper and faster) or OpenAI's
                    - code [ref=e480]: whisper-1
                    - text: .
                  - listitem [ref=e481]:
                    - strong [ref=e482]: Frames + transcript are handed to Claude.
                    - text: The script prints frame paths with
                    - code [ref=e483]: t=MM:SS
                    - text: markers and the transcript with timestamps. Claude
                    - code [ref=e484]: Read
                    - text: s each frame in parallel — JPEGs render directly as images in its context.
                  - listitem [ref=e485]:
                    - strong [ref=e486]: Claude answers grounded in what's actually on screen and in the audio.
                    - text: Not "based on the description" or "according to the title." It saw the frames. It heard the transcript. It answers the way someone who watched the video would.
                  - listitem [ref=e487]:
                    - strong [ref=e488]: Cleanup.
                    - text: The script prints a working directory at the end. If you're not asking follow-ups, Claude removes it.
                - generic [ref=e489]:
