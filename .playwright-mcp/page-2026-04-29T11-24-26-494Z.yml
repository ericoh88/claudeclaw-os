                - paragraph [ref=e390]:
                  - strong [ref=e391]: Give Claude the ability to watch any video.
                - paragraph [ref=e392]: "Claude Code:"
                - generic [ref=e393]:
                  - code [ref=e395]: /plugin marketplace add bradautomates/claude-video /plugin install watch@claude-video
