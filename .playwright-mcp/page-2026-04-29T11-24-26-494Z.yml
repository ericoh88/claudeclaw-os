                - paragraph [ref=e412]:
                  - text: Zero config to start —
                  - code [ref=e413]: yt-dlp
                  - text: and
                  - code [ref=e414]: ffmpeg
                  - text: install on first run via
                  - code [ref=e415]: brew
                  - text: on macOS (Linux/Windows print exact commands). Captions cover most public videos for free. Whisper API key is only needed when a video has no captions.
                - separator [ref=e416]
                - paragraph [ref=e417]:
                  - text: Claude can read a webpage, run a script, browse a repo. What it can't do, out of the box, is
                  - emphasis [ref=e418]: watch a video
                  - text: . You paste a YouTube link and it has to either guess from the title or pull a transcript that's missing 90% of what's on screen.
                - paragraph [ref=e419]:
                  - text: With Claude Video
                  - code [ref=e420]: /watch
                  - text: you can paste a URL or a local path, ask a question, and Claude downloads the video, extracts frames at an auto-scaled rate, pulls a timestamped transcript (free captions when available, Whisper API as fallback), and
                  - code [ref=e421]: Read
                  - text: s every frame as an image. By the time it answers, it has
                  - emphasis [ref=e422]: seen
                  - text: the video and
                  - emphasis [ref=e423]: heard
                  - text: the audio.
                - generic [ref=e424]:
                  - code [ref=e426]: /watch https://youtu.be/dQw4w9WgXcQ what happens at the 30 second mark?
                  - button "Copy" [ref=e428] [cursor=pointer]:
                    - img [ref=e429]
                - generic [ref=e432]:
                  - heading "Why this exists" [level=2] [ref=e433]
                  - 'link "Permalink: Why this exists" [ref=e434] [cursor=pointer]':
                    - /url: "#why-this-exists"
                    - img [ref=e435]
                - paragraph [ref=e437]: I built this because I'm constantly using video to keep up with content. If I see a YouTube video that's blowing up, I want to know how the creator structured the hook — what's on screen in the first 3 seconds, what they said, why it worked. That used to mean watching it myself with a notepad. Now I just paste the URL and ask.
                - paragraph [ref=e438]: The other half is summarization. Most YouTube videos don't deserve 20 minutes of my attention. I hand the URL to Claude, it pulls the transcript, and tells me what actually happened. If the visual matters, frames come along too. If it's a podcast or a talking head, transcript is enough.
                - paragraph [ref=e439]:
                  - text: Claude is great at reading and synthesizing — but until now, video was the one input I couldn't hand it. Pasting a YouTube link got you nothing useful.
                  - code [ref=e440]: /watch
                  - text: closes that gap.
                - generic [ref=e441]:
                  - heading "What people actually use it for" [level=2] [ref=e442]
                  - 'link "Permalink: What people actually use it for" [ref=e443] [cursor=pointer]':
                    - /url: "#what-people-actually-use-it-for"
                    - img [ref=e444]
                - paragraph [ref=e446]:
                  - strong [ref=e447]: Analyze someone else's content.
                  - code [ref=e448]: /watch https://youtu.be/<viral-video> what hook did they open with?
                  - text: Claude looks at the first frames, reads the opening transcript, breaks down the structure. Same for ad creative, competitor launches, podcast intros, anything where the
                  - emphasis [ref=e449]: how
                  - text: matters as much as the
                  - emphasis [ref=e450]: what
                  - text: .
                - paragraph [ref=e451]:
                  - strong [ref=e452]: Diagnose a bug from a video.
                  - text: Someone sends you a screen recording of something broken.
                  - code [ref=e453]: /watch bug-repro.mov what's going wrong?
                  - text: Claude watches the recording, finds the frame where the issue appears, describes what's on screen, often catches the cause without you ever opening the file.
                - paragraph [ref=e454]:
                  - strong [ref=e455]: Summarize a video.
                  - code [ref=e456]: /watch https://youtu.be/<long-thing> summarize this
                  - text: does the obvious thing — pulls the structure, the key moments, what was actually said and shown. Faster than watching at 2x.
                - generic [ref=e457]:
                  - heading "How it works" [level=2] [ref=e458]
                  - 'link "Permalink: How it works" [ref=e459] [cursor=pointer]':
