                    - generic [ref=e962]: "A few days ago I hit 500,000 subscribers on YouTube after posting 705 videos for 4 years. CRAZY because I also wanted to quit like 500k times in the early days. I still remember in 2022 recording in a tiny closet with my laptop balanced on a laundry basket, trying not to wake anyone up, wondering if the world needed another dude about startups and convincing myself that maybe a few hundred people would find it useful if I kept going. And for a long time, I'd be happy if 1000 people watched my stuff. It took me 12 months to hit 10k subs, 12 months to hit 20k subs, 12 months to hit 100k subs and 12 months to hit 500k months. Somewhere in the middle of the bad lighting, bad audio, and bad confidence, founders started messaging me. They were using the videos to make decisions, ship products, and try things they had been avoiding for months. That was the moment I realized I had to keep going because something I made in a tiny closet was suddenly showing up in someone else’s life at exactly the right moment, and when you feel that connection for the first time, it changes the way you see the whole project. It also made me realize how many builders are out there trying to make sense of AI, trying to design from scratch, trying to turn weird ideas into tiny businesses, trying to find leverage in a world that moves faster than anyone ever prepares you for. The 500K is cool i guess, but the cooler part is the collective energy around it thousands of strangers learning, experimenting, arguing, DMing, building, and pushing their luck a little harder each week. Being a small piece of that current feels like the real milestone. That's the cool part. Half a million people now show up. Millions of views a month. Millions of minutes. A giant, invisible room of people who decided something I said was worth their attention. That still stops me and i want to thank you from the bottom of my heart. I’m still here with the same goal I started the channel with: Be useful, share a BOATLOAD of startup ideas and growth tactics, serve up tutorials on how to use AI to do big things and watch some of you take those ideas and become wildly successful in your own way. Thanks for being here. I can't say for certain I know what 2026 and beyond hold for me The Startup ideas Podcast. If you keep going, I'll keep going. Let’s see where we go next."
